<!DOCTYPE html>
<html lang="en">
    <head>
        <title>meow</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width">
        <link href="styles.css" rel="stylesheet">

    </head>
    <body>
        <div class="flexy">

            <div class="kitty" id="kitty">
                <p id="head">
                    <span class="ears" id="left-ear">^</span>
                    <span class="eyes"id="left-eye">-</span>
                    <span id="mouth">w</span>
                    <span class="eyes" id="right-eye">-</span>
                    <span class="ears" id="right-ear">^</span>
                </p>
                <p id="arms">
                    <span id="left-arm"><</span>
                    <span class="preserve-space">     </span>
                    <span id="right-arm">></span>
                </p>
                <p id="torso">
                    <span id="left-side">|</span>
                    <span class="preserve-space">   </span>
                    <span id="right-side">|</span>
                </p>
                <p id="bottom"> 
                    <span>----</span> 
                </p>
                <p id="feet">
                    <span id="left-foot">'</span>
                    <span class="preserve-space">   </span>
                    <span id="right-foot">'</span>
                </p>
            </div>

            <div class="buttons">
                <button id="jump" class="buttons">Jump!</button>
                <button id="purr" class="buttons">Purr</button>
                <button id="cray" class="buttons">Insanity :3</button>
                <button id="meow" class="buttons">Meow</button>
                <button id="dance" class="buttons">Dance</button>

            </div>

            <script src="script.js"></script>

        </div>
    </body>


</html>
